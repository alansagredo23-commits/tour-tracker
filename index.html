<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="NEXUS Sales"/>
  <meta name="theme-color" content="#000008"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <title>NEXUS · Unlimited VC</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    :root{
      --c0:#000008;--c1:#04081A;--c2:#080F2A;--c3:#0C1840;
      --gold:#C9A84C;--gold2:#F0D98A;--gold3:#8A6020;
      --cyan:#00D4FF;--cyan2:#00FFEE;--cyan3:#006680;
      --green:#00FF88;--green2:#00C464;--green3:#003A20;
      --red:#FF3366;--red2:#FF6688;--red3:#3A000F;
      --amber:#FFB020;--amber2:#FFD060;--amber3:#3A2800;
      --purple:#9B59F5;--purple2:#C090FF;--purple3:#1A0040;
      --text:#E8F0FF;--textmd:#8898B8;--textsm:#445570;
      --border:rgba(0,212,255,0.12);--border2:rgba(0,212,255,0.25);
      --surface:rgba(8,15,42,0.8);--glass:rgba(4,8,26,0.6);
    }
    html,body{height:100%;overflow-x:hidden}
    body{background:var(--c0);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
    input,textarea,button,select{-webkit-appearance:none;font-family:'Inter',sans-serif;outline:none}
    button{cursor:pointer}
    ::-webkit-scrollbar{width:0;height:0}

    /* ── SPLASH ── */
    #splash{
      position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 40%,#0a1535 0%,#000008 70%);
      transition:opacity 0.8s ease,transform 0.8s ease;
    }
    #splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
    .splash-grid{
      position:absolute;inset:0;
      background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
      background-size:40px 40px;
      animation:gridPulse 4s ease-in-out infinite;
    }
    @keyframes gridPulse{0%,100%{opacity:0.5}50%{opacity:1}}
    .splash-glow{
      position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:600px;height:300px;
      background:radial-gradient(ellipse,rgba(0,212,255,0.15) 0%,transparent 70%);
      pointer-events:none;
    }
    .splash-logo{
      position:relative;z-index:1;text-align:center;
    }
    .splash-icon{
      font-size:72px;display:block;margin-bottom:16px;
      animation:iconFloat 3s ease-in-out infinite;
      filter:drop-shadow(0 0 30px rgba(0,212,255,0.5));
    }
    @keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .splash-brand{
      font-family:'Orbitron',monospace;font-size:11px;letter-spacing:6px;
      color:var(--cyan);font-weight:700;text-transform:uppercase;margin-bottom:12px;
    }
    .splash-title{
      font-family:'Orbitron',monospace;font-size:42px;font-weight:900;
      color:#fff;letter-spacing:4px;margin-bottom:6px;
      text-shadow:0 0 40px rgba(0,212,255,0.4);
    }
    .splash-sub{color:var(--textmd);font-size:13px;letter-spacing:2px;margin-bottom:40px}
    .splash-bar-wrap{width:260px;height:2px;background:rgba(0,212,255,0.1);border-radius:2px;overflow:hidden;margin-bottom:12px}
    .splash-bar{height:100%;width:5%;background:linear-gradient(90deg,var(--cyan3),var(--cyan),var(--cyan2));border-radius:2px;transition:width 0.4s ease;box-shadow:0 0 12px var(--cyan)}
    .splash-status{color:var(--textsm);font-size:10px;letter-spacing:2px;font-family:'Orbitron',monospace}

    /* ── SCANLINE OVERLAY ── */
    .scanlines{
      position:fixed;inset:0;pointer-events:none;z-index:1;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.015) 2px,rgba(0,0,0,0.015) 4px);
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(0,212,255,0.3)}50%{box-shadow:0 0 24px rgba(0,212,255,0.7)}}
    @keyframes scanLine{0%{top:-5%}100%{top:105%}}
    @keyframes numberCount{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
    @keyframes borderGlow{0%,100%{border-color:rgba(0,212,255,0.12)}50%{border-color:rgba(0,212,255,0.4)}}

    .anim-fadeup{animation:fadeUp 0.4s ease forwards}
    .anim-fadein{animation:fadeIn 0.3s ease forwards}

    /* ── NEON CARD ── */
    .neon-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      backdrop-filter:blur(20px);
      position:relative;overflow:hidden;
      transition:border-color 0.3s,box-shadow 0.3s;
    }
    .neon-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);
      opacity:0.4;
    }
    .neon-card:active{border-color:var(--border2)}

    /* ── HUD LINES ── */
    .hud-corner{position:relative}
    .hud-corner::before,.hud-corner::after{content:'';position:absolute;width:12px;height:12px}
    .hud-corner::before{top:0;left:0;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
    .hud-corner::after{bottom:0;right:0;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}

    /* ── TAB BAR ── */
    .tabbar{
      position:fixed;bottom:0;left:0;right:0;z-index:200;
      background:rgba(0,0,8,0.92);
      backdrop-filter:blur(24px);
      border-top:1px solid var(--border);
      display:flex;justify-content:space-around;align-items:center;
      padding:10px 0 max(20px,env(safe-area-inset-bottom,20px));
    }
    .tabbar::before{
      content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);
      opacity:0.5;
    }
    .tab-btn{
      background:none;border:none;display:flex;flex-direction:column;
      align-items:center;gap:4px;padding:0 12px;position:relative;
    }
    .tab-icon{font-size:20px;line-height:1;transition:transform 0.2s,filter 0.2s}
    .tab-label{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:color 0.2s}
    .tab-btn.active .tab-icon{transform:scale(1.15);filter:drop-shadow(0 0 8px var(--cyan))}
    .tab-btn.active .tab-label{color:var(--cyan)}
    .tab-btn:not(.active) .tab-label{color:var(--textsm)}
    .tab-dot{width:4px;height:4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s infinite}

    /* ── INPUTS ── */
    .neon-input{
      width:100%;background:rgba(0,0,20,0.6);
      border:1px solid var(--border2);color:var(--text);
      padding:14px 16px;border-radius:10px;font-size:16px;
      font-family:'Inter',sans-serif;transition:border-color 0.2s,box-shadow 0.2s;
    }
    .neon-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.1)}
    .neon-input::placeholder{color:var(--textsm)}

    /* ── PILL ── */
    .pill{
      display:inline-flex;align-items:center;gap:5px;
      padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
      letter-spacing:0.5px;white-space:nowrap;
    }
    .pill-dot{width:5px;height:5px;border-radius:50%}

    /* ── STAT RING ── */
    .stat-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}

    /* ── SCROLL ── */
    .scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
    .scroll-x::-webkit-scrollbar{display:none}

    /* ── PIN PAD ── */
    .pin-btn{
      background:rgba(0,212,255,0.05);
      border:1px solid rgba(0,212,255,0.15);
      border-radius:14px;padding:20px;
      font-size:22px;font-weight:700;color:var(--text);
      transition:background 0.15s,border-color 0.15s,transform 0.1s;
      font-family:'Orbitron',monospace;
    }
    .pin-btn:active{background:rgba(0,212,255,0.15);border-color:var(--cyan);transform:scale(0.95)}

    /* ── NAV ── */
    .navbar{
      position:sticky;top:0;z-index:100;
      background:rgba(0,0,8,0.9);backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;
      padding-top:max(14px,calc(env(safe-area-inset-top,0px) + 10px));
    }
    .navbar::after{
      content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);
      opacity:0.3;
    }
    .nav-back{background:none;border:none;color:var(--cyan);font-size:14px;font-weight:600;letter-spacing:1px;padding:0;display:flex;align-items:center;gap:6px}
    .nav-title{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--text);letter-spacing:2px;text-transform:uppercase}
    .nav-action{background:linear-gradient(135deg,var(--cyan3),var(--cyan));border:none;color:#000;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:800;letter-spacing:1px}

    /* ── PERIOD BAR ── */
    .period-chip{
      padding:7px 16px;border-radius:20px;font-size:11px;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;white-space:nowrap;
      border:1px solid;transition:all 0.2s;flex-shrink:0;
    }
    .period-chip.active{background:var(--cyan);border-color:var(--cyan);color:#000;box-shadow:0 0 16px rgba(0,212,255,0.4)}
    .period-chip:not(.active){background:transparent;border-color:var(--border2);color:var(--textmd)}

    /* ── PROGRESS BAR ── */
    .prog-track{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
    .prog-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.22,1,0.36,1)}

    /* ── GLOW BUTTON ── */
    .glow-btn{
      width:100%;border:none;padding:18px 24px;border-radius:14px;
      font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
      font-family:'Orbitron',monospace;transition:all 0.2s;
    }
    .glow-btn-cyan{
      background:linear-gradient(135deg,var(--cyan3),var(--cyan));color:#000;
      box-shadow:0 4px 24px rgba(0,212,255,0.35);
    }
    .glow-btn-cyan:active{transform:scale(0.98);box-shadow:0 2px 12px rgba(0,212,255,0.2)}
    .glow-btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--textmd)}

    /* ── SECTION LABEL ── */
    .sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--textsm);margin-bottom:8px}

    /* ── AVATAR ── */
    .avatar{
      border-radius:50%;background:linear-gradient(135deg,var(--c2),var(--c3));
      display:flex;align-items:center;justify-content:center;
      font-weight:800;color:var(--cyan);flex-shrink:0;
      border:1px solid var(--border2);font-family:'Orbitron',monospace;
    }

    /* ── STATUS SELECTOR ── */
    .status-btn{
      padding:12px;border-radius:10px;border:1.5px solid;
      font-size:12px;font-weight:700;letter-spacing:0.5px;
      display:flex;align-items:center;gap:6px;justify-content:center;
      transition:all 0.15s;
    }

    /* ── METRIC CARD ── */
    .metric-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:16px;padding:18px;position:relative;overflow:hidden;
    }
    .metric-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0.3;
    }

    /* ── RANK PODIUM ── */
    .podium-block{
      border-radius:12px 12px 0 0;display:flex;align-items:flex-start;
      justify-content:center;padding-top:12px;
    }

    /* ── SCROLLABLE CONTENT ── */
    .page-content{padding-bottom:100px}

    /* ── CYBER DIVIDER ── */
    .cyber-div{
      height:1px;
      background:linear-gradient(90deg,transparent,var(--border2),transparent);
      margin:0 16px;
    }

    /* ── CLIENT ROW ── */
    .client-row{
      background:var(--surface);border:1px solid var(--border);
      border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;
      transition:border-color 0.2s;
    }
    .client-row:active{border-color:var(--border2)}
  </style>
</head>

  <div id="root"></div>

  <script>

  function setP(p,m){
    document.getElementById("pbar").style.width=p+"%";
    document.getElementById("status").textContent=m;
  }

  function launchApp(code){
    try{
      var fn = new Function("React","ReactDOM",code+"\nreturn Root;");
      var Root = fn(React,ReactDOM);
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root));
      var s = document.getElementById("splash");
      s.classList.add("hide");
      setTimeout(function(){s.style.display="none";},900);
    } catch(e){
      setP(100,"ERROR: "+e.message.slice(0,80));
      console.error(e);
    }
  }

  function startCompile(){
    setP(75,"COMPILING MODULES...");
    setTimeout(function(){
      try{
        var src = "const {useState,useMemo,useEffect,useCallback,useRef}=React;\nconst db=window.db;\n"+window.APP_SOURCE;
        var compiled = Babel.transform(src,{presets:["react"],compact:true}).code;
        try{localStorage.setItem(CACHE_KEY,compiled);}catch(e){}
        setP(95,"LAUNCHING...");
        setTimeout(function(){launchApp(compiled);},60);
      } catch(e){
        setP(100,"COMPILE ERROR: "+e.message.slice(0,80));
        console.error(e);
      }
    },100);
  }

  function onSupa(){
    var URL = "https://gztfpunrbxlbzuthgbxg.supabase.co";

    var sb = window.supabase.createClient(URL,KEY);
    var ok = function(r){return r.data||[];};
    window.db = {
      getUsers:     function()      { return sb.from("users").select("*").order("created_at",{ascending:true}).then(ok); },
      createUser:   function(u)     { return sb.from("users").insert(u).select().then(ok); },
      updateUser:   function(id,u)  { return sb.from("users").update(u).eq("id",id).select().then(ok); },
      getClients:   function(uid)   { return sb.from("clients").select("*").eq("user_id",uid).order("created_at",{ascending:false}).then(ok); },
      getAllClients: function()      { return sb.from("clients").select("*,users(name,avatar)").then(ok); },
      createClient: function(c)     { return sb.from("clients").insert(c).select().then(ok); },
      updateClient: function(id,c)  { return sb.from("clients").update(c).eq("id",id).select().then(function(r){return ok(r);}); },
      deleteClient: function(id)    { return sb.from("clients").delete().eq("id",id).then(function(){return[];}); },

    try{
      var cached = localStorage.getItem(CACHE_KEY);
      if(cached){ setP(95,"LOADING CACHE..."); setTimeout(function(){launchApp(cached);},50); return; }

    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js";
    sc.onload = startCompile;
    sc.onerror = function(){ setP(100,"COMPILER FAILED"); };

  function boot(){
    setP(10,"LOADING REACTOR...");
    var s1 = document.createElement("script");
    s1.src = "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js";
    s1.onload = function(){
      setP(30,"LOADING RENDER ENGINE...");
      var s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js";
      s2.onload = function(){
        setP(50,"CONNECTING TO DATABASE...");
        var s3 = document.createElement("script");
        s3.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
        s3.onload = function(){ setP(65,"ESTABLISHING LINK..."); onSupa(); };
        s3.onerror = function(){ setP(100,"DATABASE CONNECTION FAILED"); };
        document.head.appendChild(s3);
      };
      s2.onerror = function(){ setP(100,"RENDER ENGINE FAILED"); };
      document.head.appendChild(s2);
    };
    s1.onerror = function(){ setP(100,"REACTOR FAILED"); };
    document.head.appendChild(s1);

  window.addEventListener("DOMContentLoaded", boot);

// ── UTILS ─────────────────────────────────────────────────────
function fmt(v)  { return "$"+Number(v||0).toLocaleString(); }
function fmtD(v) { return "$"+Number(v||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,","); }

function getCommRate(type,pay){
  const map={"FTM":"Liner","ftm":"Liner","liner":"Liner","closer":"Closer","front to back":"Front to Back","front to mid":"Front to Mid"};
  const t = map[type]||type||"Liner";
  const r = COMM_RATES[t]||{normal:4};
  if(pay==="dp50"    && r.dp50)    return r.dp50;
  if(pay==="cash100" && r.cash100) return r.cash100;
  return r.normal;
}

function calcComm(value,type,pay){
  const rate     = getCommRate(type,pay);
  const gross    = value * 0.45 * (rate/100);
  const cancFund = gross * 0.10;
  return { gross, cancFund, net:gross-cancFund, rate };
}

function getPayrollCycle(dateStr){
  if(!dateStr) return null;
  const d   = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  const daysToWed = day>=3 ? day-3 : day+4;
  const open = new Date(d); open.setDate(d.getDate()-daysToWed);
  const close = new Date(open); close.setDate(open.getDate()+6);
  const cd = close.getDay();
  const dToThu = cd<=4 ? (4-cd||7) : 7-cd+4;
  const fThu = new Date(close); fThu.setDate(close.getDate()+dToThu);
  const pay = new Date(fThu); pay.setDate(fThu.getDate()+7);
  const ymd = x => x.toISOString().slice(0,10);
  return { open:ymd(open), close:ymd(close), pay:ymd(pay), key:ymd(open) };
}

function fmtDate(str){
  if(!str) return "—";
  const [y,m,d] = str.split("-");
  const mo=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return mo[parseInt(m)-1]+" "+parseInt(d)+", "+y;
}

function daysUntil(str){
  if(!str) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(str+"T00:00:00")-today)/86400000);
}

function getRange(period){
  const now=new Date(); const ymd=d=>d.toISOString().slice(0,10);
  const startOf=(d,u)=>{const r=new Date(d);if(u==="week"){r.setDate(d.getDate()-d.getDay());r.setHours(0,0,0,0);}if(u==="month"){r.setDate(1);r.setHours(0,0,0,0);}if(u==="year"){r.setMonth(0,1);r.setHours(0,0,0,0);}if(u==="day"){r.setHours(0,0,0,0);}return r;};
  if(period==="Today")      return {from:ymd(startOf(now,"day")),  to:ymd(now)};
  if(period==="This Week")  return {from:ymd(startOf(now,"week")), to:ymd(now)};
  if(period==="This Month") return {from:ymd(startOf(now,"month")),to:ymd(now)};
  if(period==="Last Month"){const s=new Date(now.getFullYear(),now.getMonth()-1,1);const e=new Date(now.getFullYear(),now.getMonth(),0);return{from:ymd(s),to:ymd(e)};}
  if(period==="This Year")  return {from:ymd(startOf(now,"year")), to:ymd(now)};
  return {from:null,to:null};
}

function inRange(dateStr,range){
  if(!range.from) return true;
  if(!dateStr)    return false;
  return dateStr>=range.from && dateStr<=range.to;
}

function AuthScreen({onLogin}){
  const [view,setView]     = useState("pin");
  const [pin,setPin]       = useState("");
  const [name,setName]     = useState("");
  const [newPin,setNewPin] = useState("");
  const [avatar,setAvatar] = useState("⚡");
  const [error,setError]   = useState("");
  const [saving,setSaving] = useState(false);

  async function handlePin(p){
    if(p.length!==4) return;
    setError("");
    const users = await db.getUsers();
    const match = (users||[]).find(u=>u.pin===p);
    if(!match){ setError("ACCESS DENIED — PIN NOT FOUND"); setPin(""); return; }
    saveSession(match); onLogin(match);
  }

  async function handleRegister(){
    if(!name.trim())            { setError("ENTER YOUR NAME"); return; }
    if(!/^\d{4}$/.test(newPin)) { setError("PIN MUST BE 4 DIGITS"); return; }
    const users = await db.getUsers();
    if((users||[]).find(u=>u.pin===newPin))  { setError("PIN ALREADY IN USE"); return; }
    if((users||[]).find(u=>u.name.toLowerCase()===name.trim().toLowerCase())) { setError("NAME ALREADY TAKEN"); return; }
    setSaving(true); setError("");
    try{
      const rows = await Promise.race([
        db.createUser({name:name.trim(),pin:newPin,avatar,comm_rate:4,close_target:70}),
        new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),12000))
      ]);
      setSaving(false);
      if(!rows||!rows[0]){ setError("SAVE FAILED — TRY AGAIN"); return; }
      saveSession(rows[0]); onLogin(rows[0]);
    } catch(e){
      setSaving(false); setError("CONNECTION FAILED");
    }
  }

  function PinDots({value}){
    return <div style={{display:"flex",justifyContent:"center",gap:"16px",marginBottom:"32px"}}>
      {[0,1,2,3].map(i=>(
        <div key={i} style={{
          width:14,height:14,borderRadius:"50%",
          background:value.length>i?"#00D4FF":"rgba(0,212,255,0.1)",
          border:"1px solid "+(value.length>i?"#00D4FF":"rgba(0,212,255,0.2)"),
          boxShadow:value.length>i?"0 0 12px #00D4FF,0 0 24px rgba(0,212,255,0.4)":"none",
          transition:"all 0.15s"
        }}/>
      ))}
    </div>;
  }

  function NumPad({value,onChange,onComplete}){
    return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",maxWidth:300,margin:"0 auto"}}>
      {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((d,i)=>(
        d===""?<div key={i}/>:
        <button key={i} className="pin-btn" onClick={()=>{
          if(d==="⌫"){onChange(value.slice(0,-1));return;}
          if(value.length<4){
            const n=value+d; onChange(n);
            if(n.length===4&&onComplete) setTimeout(()=>onComplete(n),80);
          }
        }}>{d}</button>
      ))}
    </div>;
  }

  const pageStyle={minHeight:"100vh",background:"var(--c0)",fontFamily:"'Inter',sans-serif",position:"relative",overflow:"hidden"};
  const gridBg={position:"absolute",inset:0,backgroundImage:"linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px)",backgroundSize:"40px 40px",pointerEvents:"none"};

  if(view==="pin") return (
    <div style={pageStyle}>
      <div style={gridBg}/>
      <div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:"100%",height:"400px",background:"radial-gradient(ellipse at 50% 0%,rgba(0,212,255,0.1) 0%,transparent 70%)",pointerEvents:"none"}}/>
      <div style={{position:"relative",zIndex:1,padding:"80px 28px 40px",textAlign:"center",animation:"fadeUp 0.6s ease"}}>
        <div style={{fontSize:"64px",marginBottom:"16px",filter:"drop-shadow(0 0 30px rgba(0,212,255,0.5))",animation:"iconFloat 3s ease-in-out infinite"}}>⚡</div>
        <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"5px",color:"var(--cyan)",fontWeight:"700",marginBottom:"10px"}}>UNLIMITED VC · SALES OS</div>
        <h1 style={{fontFamily:"'Orbitron',monospace",margin:"0 0 6px",fontSize:"36px",fontWeight:"900",color:"#fff",letterSpacing:"4px",textShadow:"0 0 40px rgba(0,212,255,0.4)"}}>NEXUS</h1>
        <p style={{fontSize:"12px",color:"var(--textsm)",letterSpacing:"2px",marginBottom:"44px"}}>ENTER ACCESS CODE</p>
        <PinDots value={pin}/>
        <NumPad value={pin} onChange={setPin} onComplete={handlePin}/>
        {error&&(
          <div style={{marginTop:"20px",background:"rgba(255,51,102,0.1)",border:"1px solid rgba(255,51,102,0.3)",borderRadius:"10px",padding:"12px 16px",color:"#FF3366",fontSize:"11px",fontWeight:"700",letterSpacing:"1px",fontFamily:"'Orbitron',monospace",maxWidth:300,margin:"20px auto 0"}}>
            ⚠ {error}
          </div>
        )}
        <button onClick={()=>{setError("");setPin("");setName("");setNewPin("");setAvatar("⚡");setView("register");}} style={{marginTop:"36px",background:"transparent",border:"1px solid var(--border2)",color:"var(--textmd)",padding:"12px 28px",borderRadius:"12px",fontFamily:"'Orbitron',monospace",fontSize:"10px",letterSpacing:"2px",display:"block",margin:"36px auto 0"}}>
          + CREATE PROFILE
        </button>
      </div>
      <style>{"@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}"}</style>
    </div>
  );

  return (
    <div style={{...pageStyle,background:"var(--c0)"}}>
      <div style={gridBg}/>
      <div className="navbar" style={{position:"relative"}}>
        <button className="nav-back" onClick={()=>{setView("pin");setError("");}}>‹ BACK</button>
        <span className="nav-title">CREATE PROFILE</span>
        <div style={{width:72}}/>
      </div>
      <div style={{padding:"20px 16px",display:"flex",flexDirection:"column",gap:"16px",animation:"fadeUp 0.4s ease"}}>
        {/* Avatar */}
        <div className="neon-card" style={{padding:"18px"}}>
          <SectionLabel>Choose Avatar</SectionLabel>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:"8px"}}>
            {AVATARS.map(a=>(
              <button key={a} onClick={()=>setAvatar(a)} style={{
                background:avatar===a?"rgba(0,212,255,0.15)":"rgba(0,0,20,0.4)",
                border:"1px solid "+(avatar===a?"#00D4FF":"rgba(0,212,255,0.1)"),
                borderRadius:"12px",padding:"10px 0",fontSize:"24px",
                display:"flex",alignItems:"center",justifyContent:"center",
                boxShadow:avatar===a?"0 0 16px rgba(0,212,255,0.3)":"none",
                transition:"all 0.15s",
              }}>{a}</button>
            ))}
          </div>
        </div>
        {/* Name */}
        <div className="neon-card" style={{padding:"18px"}}>
          <SectionLabel>Your Name</SectionLabel>
          <input type="text" className="neon-input" value={name} onChange={e=>setName(e.target.value)} placeholder="First name or full name"/>
        </div>
        {/* PIN */}
        <div className="neon-card" style={{padding:"18px"}}>
          <SectionLabel>Set 4-Digit PIN</SectionLabel>
          <PinDots value={newPin}/>
          <NumPad value={newPin} onChange={setNewPin}/>
        </div>
        {error&&<div style={{background:"rgba(255,51,102,0.1)",border:"1px solid rgba(255,51,102,0.3)",borderRadius:"10px",padding:"12px 16px",color:"#FF3366",fontSize:"11px",fontWeight:"700",letterSpacing:"1px",fontFamily:"'Orbitron',monospace"}}>⚠ {error}</div>}

      <style>{"@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}"}</style>

  const stats = useMemo(()=>{
    const closed  = periodC.filter(c=>c.status==="Closed");

    const revenue = closed.reduce((s,c)=>s+c.value,0);
    const pipeline= pending.reduce((s,c)=>s+c.value,0);
    const cr      = active.length ? Math.round((closed.length/active.length)*100) : 0;
    const comm    = closed.reduce((a,c)=>{ const r=calcComm(c.value,c.sale_type,c.payment_type); return {gross:a.gross+r.gross,cancFund:a.cancFund+r.cancFund,net:a.net+r.net}; },{gross:0,cancFund:0,net:0});
    return {
      revenue, pipeline, closeRate:cr,
      tours:periodC.filter(c=>c.status==="Tour").length,
      total:periodC.length, closed:closed.length,
      pending:pending.length,
      noSale:periodC.filter(c=>c.status==="No Sale").length,
      cancelled:periodC.filter(c=>c.status==="Cancelled").length,
      avgDeal:closed.length?Math.round(revenue/closed.length):0,
      ...comm
    };
  },[periodC]);

  const payrollCycles = useMemo(()=>{
    const map={};
    clients.filter(c=>c.status==="Closed"&&c.date).forEach(c=>{
      const cy=getPayrollCycle(c.date); if(!cy) return;
      if(!map[cy.key]) map[cy.key]={...cy,deals:[]};
      map[cy.key].deals.push({...c,...calcComm(c.value,c.sale_type,c.payment_type)});

    return Object.values(map).sort((a,b)=>b.key.localeCompare(a.key));

    setBoardData((allU||[]).map(u=>{
      const uc=(allC||[]).filter(c=>c.user_id===u.id&&inRange(c.date,r));

      const active=uc.filter(c=>c.status!=="Cancelled");
      return {...u, volume:closed.reduce((s,c)=>s+c.value,0), closeRate:active.length?Math.round((closed.length/active.length)*100):0, deals:closed.length};
    }));
    setBL(false);
  },[period]);

    if(!form.name.trim()||!form.value){ setFE("Client name and deal value required."); return; }

  // ── CLIENT LIST ──────────────────────────────────────────
  if(screen==="list") return (

  // ── DETAIL ───────────────────────────────────────────────
  if(screen==="detail"){
    const c=clients.find(x=>x.id===detailId);

      <div style={wrap}>
        <NavBar title="CLIENT DETAIL" back={goList} action={{label:"EDIT",fn:()=>openEdit(c)}}/>

                  const cols=["linear-gradient(180deg,#A0B0C0,#708090)","linear-gradient(180deg,#F0D98A,#C9A84C)","linear-gradient(180deg,#C08050,#906030)"];

                    <div key={u.id} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}}>

                      <div style={{fontSize:"28px",filter:"drop-shadow(0 0 12px rgba(0,212,255,0.4))"}}>{u.avatar}</div>
                      <div style={{fontSize:"11px",fontWeight:"700",color:"var(--text)",maxWidth:"70px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textAlign:"center"}}>{u.name.split(" ")[0]}</div>
                      <div style={{fontSize:"12px",fontWeight:"800",color:"var(--green)",textShadow:"0 0 10px rgba(0,255,136,0.5)"}}>{val}</div>
                      <div className="podium-block" style={{width:"100%",height:heights[i],background:cols[rank],border:isMe?"2px solid var(--cyan)":"none",boxShadow:isMe?"0 0 20px rgba(0,212,255,0.4)":"none"}}>
                        <span style={{fontSize:"22px"}}>{medals[rank]}</span>
                      </div>
                    </div>
                  );

              </div>

              {/* Rankings */}
              <div className="neon-card" style={{overflow:"hidden"}}>
                <div style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"2px",color:"var(--textsm)"}}>ALL REPS · {period.toUpperCase()}</div>
                {sorted.map((u,i)=>{
                  const isMe=u.id===user.id;
                  const val=sortBy==="volume"?fmt(u.volume):pct(u.closeRate);

        <div style={{fontSize:"11px",color:"var(--textsm)",letterSpacing:"1px"}}>WED→TUE CYCLE · PAY 2ND THURSDAY</div>
      </div>

      {/* Rate selector */}
      <div style={{background:"rgba(0,0,8,0.6)",borderBottom:"1px solid var(--border)",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"2px",color:"var(--textsm)",marginBottom:"3px"}}>COMMISSION RATE</div>
          <div style={{fontSize:"11px",color:"var(--textsm)"}}>Set by management</div>
        </div>
        <div style={{display:"flex",gap:"8px"}}>
          {[4,5].map(r=><button key={r} onClick={()=>setCommRate(r)} style={{background:commRate===r?"var(--gold2,#F0D98A)":"transparent",border:"1px solid "+(commRate===r?"#F0D98A":"var(--border2)"),color:commRate===r?"#000":"var(--textmd)",padding:"8px 20px",borderRadius:"10px",fontFamily:"'Orbitron',monospace",fontSize:"14px",fontWeight:"700",boxShadow:commRate===r?"0 0 16px rgba(240,217,138,0.4)":"none"}}>{r}%</button>)}
        </div>
      </div>

      {/* Totals */}
      <div style={{padding:"14px 14px 0",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px"}}>
        {[
          {label:"GROSS",value:fmtD(payrollCycles.reduce((s,c)=>s+c.deals.reduce((a,d)=>a+d.gross,0),0)),color:"var(--text)"},
          {label:"FUND",value:fmtD(payrollCycles.reduce((s,c)=>s+c.deals.reduce((a,d)=>a+d.cancFund,0),0)),color:"var(--red)"},
          {label:"NET",value:fmtD(payrollCycles.reduce((s,c)=>s+c.deals.reduce((a,d)=>a+d.net,0),0)),color:"var(--green)"},
        ].map(s=>(
          <div key={s.label} className="metric-card" style={{textAlign:"center",padding:"12px"}}>
            <div style={{fontFamily:"'Orbitron',monospace",fontSize:"8px",letterSpacing:"1.5px",color:"var(--textsm)",marginBottom:"4px"}}>{s.label}</div>
            <div style={{fontSize:"13px",fontWeight:"800",color:s.color,textShadow:"0 0 10px "+s.color+"60"}}>{s.value}</div>
          </div>
        ))}
      </div>

      {/* Cycles */}
      <div style={{padding:"14px",display:"flex",flexDirection:"column",gap:"12px"}}>
        {payrollCycles.length===0&&<div style={{textAlign:"center",color:"var(--textsm)",padding:"60px 0",fontFamily:"'Orbitron',monospace",fontSize:"10px",letterSpacing:"2px"}}>NO CLOSED DEALS YET</div>}
        {payrollCycles.map(cycle=>{
          const cg=cycle.deals.reduce((s,d)=>s+d.gross,0);
          const cf=cycle.deals.reduce((s,d)=>s+d.cancFund,0);
          const cn=cycle.deals.reduce((s,d)=>s+d.net,0);
          const du=daysUntil(cycle.pay);
          const isPaid=du!==null&&du<0;
          const isNext=du!==null&&du>=0&&du<=7;
          return (
            <div key={cycle.key} className="neon-card" style={{border:"1px solid "+(isNext?"rgba(240,217,138,0.3)":"var(--border)"),boxShadow:isNext?"0 4px 24px rgba(240,217,138,0.1)":"none",overflow:"hidden"}}>
              <div style={{background:isNext?"linear-gradient(135deg,rgba(240,217,138,0.08),rgba(0,0,20,0.5))":"rgba(0,0,20,0.2)",padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid var(--border)"}}>
                <div>
                  <div style={{fontFamily:"'Orbitron',monospace",fontSize:"8px",letterSpacing:"2px",color:isNext?"#F0D98A":"var(--textsm)",fontWeight:"700",marginBottom:"3px"}}>{isPaid?"✓ PAID":isNext?"⏰ UPCOMING":"PAYROLL CYCLE"}</div>
                  <div style={{fontSize:"13px",fontWeight:"600",color:"var(--text)"}}>{fmtDate(cycle.open)} → {fmtDate(cycle.close)}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:"10px",color:"var(--textsm)",marginBottom:"2px"}}>PAY DATE</div>
                  <div style={{fontSize:"12px",fontWeight:"700",color:isNext?"#F0D98A":"var(--text)"}}>{fmtDate(cycle.pay)}</div>
                  {!isPaid&&<div style={{fontSize:"10px",color:isNext?"#F0D98A":"var(--textsm)"}}>in {du}d</div>}
                  {isPaid&&<div style={{fontSize:"10px",color:"var(--green)",fontWeight:"700"}}>PAID ✓</div>}
                </div>
              </div>
              <div style={{padding:"12px 16px",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",borderBottom:"1px solid var(--border)"}}>
                {[{l:"GROSS",v:fmtD(cg),c:"var(--text)"},{l:"FUND",v:"−"+fmtD(cf),c:"var(--red)"},{l:"NET",v:fmtD(cn),c:"var(--green)"}].map(s=>(
                  <div key={s.l} style={{textAlign:"center"}}>
                    <div style={{fontFamily:"'Orbitron',monospace",fontSize:"8px",color:"var(--textsm)",letterSpacing:"1px",marginBottom:"3px"}}>{s.l}</div>
                    <div style={{fontSize:"13px",fontWeight:"800",color:s.c,textShadow:"0 0 8px "+s.c+"60"}}>{s.v}</div>
                  </div>
                ))}
              </div>
              {cycle.deals.map((d,i)=>(
                <div key={d.id} style={{padding:"12px 16px",borderBottom:i<cycle.deals.length-1?"1px solid var(--border)":"none",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:"13px",fontWeight:"600",color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
                    <div style={{display:"flex",gap:"6px",marginTop:"3px"}}>
                      {d.sale_type&&<span className="pill" style={{background:"rgba(155,89,245,0.1)",color:"#C090FF",border:"1px solid rgba(155,89,245,0.2)",fontSize:"9px"}}>{d.sale_type.toUpperCase()}</span>}
                      <span style={{fontSize:"10px",color:"var(--textsm)"}}>{fmt(d.value)}</span>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:"14px",fontWeight:"800",color:"var(--green)",textShadow:"0 0 8px rgba(0,255,136,0.4)"}}>{fmtD(d.net)}</div>
                    <div style={{fontSize:"9px",color:"var(--textsm)"}}>NET</div>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>
      <TabBar tab={tab} setTab={setTab} setScreen={setScreen} setFilter={setFilter}/>
    </div>
  );

  // ── PROFILE ──────────────────────────────────────────────
  if(screen==="profile"){
    const badge=stats.closeRate>=target
      ?{icon:"🏆",label:"TARGET REACHED",color:"#F0D98A",glow:"rgba(240,217,138,0.3)"}
      :stats.closeRate>=target*0.7
        ?{icon:"⭐",label:"ON TRACK",color:"var(--cyan)",glow:"rgba(0,212,255,0.2)"}
        :{icon:"🎯",label:"KEEP PUSHING",color:"var(--amber)",glow:"rgba(255,176,32,0.2)"};
    return (
      <div style={wrap}>
        {/* Hero */}
        <div style={{background:"linear-gradient(180deg,rgba(0,4,20,1) 0%,var(--c0) 100%)",padding:"0 22px 80px",paddingTop:"max(50px,env(safe-area-inset-top,50px))",position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:"100%",height:"400px",background:"radial-gradient(ellipse at 50% -10%,rgba(0,212,255,0.1) 0%,transparent 70%)",pointerEvents:"none"}}/>
          <div style={{position:"absolute",top:0,left:0,right:0,height:"1px",background:"linear-gradient(90deg,transparent,var(--cyan),transparent)",opacity:0.5}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"relative",zIndex:1}}>
            <div>
              <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"4px",color:"var(--cyan)",fontWeight:"700",marginBottom:"6px"}}>UNLIMITED VC · AGENT PROFILE</div>
              <div style={{fontSize:"11px",color:"var(--textsm)",letterSpacing:"1px"}}>PERFORMANCE OVERVIEW</div>
            </div>
            <button onClick={()=>{clearSession();onLogout();}} style={{background:"rgba(255,255,255,0.05)",border:"1px solid var(--border2)",color:"var(--textmd)",padding:"8px 14px",borderRadius:"8px",fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"1px"}}>SWITCH</button>
          </div>
        </div>

        {/* Avatar card */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginTop:"-56px",padding:"0 20px",position:"relative",zIndex:10}}>
          <div style={{width:112,height:112,borderRadius:56,background:"var(--c2)",border:"3px solid var(--cyan)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"52px",boxShadow:"0 0 40px rgba(0,212,255,0.4),0 8px 32px rgba(0,0,0,0.5)"}}>
            {user.avatar}
          </div>
          <div style={{marginTop:"14px",textAlign:"center"}}>
            <div style={{fontFamily:"'Orbitron',monospace",fontSize:"18px",fontWeight:"900",color:"#fff",letterSpacing:"2px"}}>{user.name.toUpperCase()}</div>
            <div style={{fontSize:"11px",color:"var(--textsm)",marginTop:"3px",letterSpacing:"1px"}}>SALES CONSULTANT · UNLIMITED VC</div>
            <div style={{display:"inline-flex",alignItems:"center",gap:"7px",background:badge.glow,border:"1px solid "+badge.color,borderRadius:"20px",padding:"6px 16px",marginTop:"12px",fontFamily:"'Orbitron',monospace",fontSize:"10px",fontWeight:"700",letterSpacing:"1px",color:badge.color,boxShadow:"0 0 16px "+badge.glow}}>
              {badge.icon} {badge.label}
            </div>
          </div>
        </div>

        <div style={{background:"rgba(0,0,8,0.6)",borderTop:"1px solid var(--border)",borderBottom:"1px solid var(--border)",paddingTop:"12px",marginTop:"20px"}}>
          <div style={{padding:"0 16px 4px",fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"2px",color:"var(--textsm)"}}>VIEWING PERIOD</div>
          <PeriodBar period={period} setPeriod={setPeriod}/>
        </div>

        <div style={{padding:"14px"}}>
          {/* Close rate card */}
          <div className="neon-card hud-corner" style={{padding:"22px",marginBottom:"12px",background:"linear-gradient(135deg,rgba(0,8,30,0.9),rgba(0,0,8,0.95))"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:"16px"}}>
              <div>
                <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",color:"var(--textsm)",letterSpacing:"2px",marginBottom:"6px"}}>CLOSE RATE · {period.toUpperCase()}</div>
                <div style={{fontFamily:"'Orbitron',monospace",fontSize:"48px",fontWeight:"900",color:"var(--cyan)",lineHeight:1,textShadow:"0 0 40px rgba(0,212,255,0.5)"}}>
                  {stats.closeRate}<span style={{fontSize:"22px",color:"rgba(0,212,255,0.6)"}}>%</span>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",color:"var(--textsm)",marginBottom:"4px"}}>TARGET</div>
                <div style={{fontFamily:"'Orbitron',monospace",fontSize:"28px",fontWeight:"900",color:"#F0D98A",textShadow:"0 0 20px rgba(240,217,138,0.4)"}}>{target}%</div>
              </div>
            </div>
            <div style={{height:10,background:"rgba(0,212,255,0.08)",borderRadius:5,overflow:"hidden",marginBottom:"10px",border:"1px solid rgba(0,212,255,0.1)"}}>
              <div style={{height:"100%",width:Math.min(100,(stats.closeRate/target)*100)+"%",background:"linear-gradient(90deg,rgba(0,212,255,0.5),var(--cyan))",boxShadow:"0 0 12px rgba(0,212,255,0.6)",borderRadius:5,transition:"width 0.8s cubic-bezier(0.22,1,0.36,1)"}}/>
            </div>
            <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",color:"var(--textsm)",marginBottom:"16px",letterSpacing:"1px"}}>{stats.closeRate>=target?"🏆 TARGET REACHED":Math.max(0,target-stats.closeRate)+"% FROM TARGET"}</div>
            {/* Commission rate */}
            <div style={{borderTop:"1px solid var(--border)",paddingTop:"14px",marginBottom:"14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
                <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",color:"var(--textsm)",letterSpacing:"2px"}}>COMMISSION RATE</div>
                <div style={{display:"flex",gap:"6px"}}>
                  {[4,5].map(r=><button key={r} onClick={()=>setCommRate(r)} style={{background:commRate===r?"rgba(240,217,138,0.15)":"transparent",border:"1px solid "+(commRate===r?"#F0D98A":"var(--border2)"),color:commRate===r?"#F0D98A":"var(--textsm)",padding:"6px 16px",borderRadius:"8px",fontFamily:"'Orbitron',monospace",fontSize:"13px",fontWeight:"700"}}>{r}%</button>)}
                </div>
              </div>
            </div>
            {/* Target slider */}
            <div style={{borderTop:"1px solid var(--border)",paddingTop:"14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
                <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",color:"var(--textsm)",letterSpacing:"2px"}}>SET TARGET</div>
                <div style={{fontFamily:"'Orbitron',monospace",fontSize:"14px",color:"#F0D98A",fontWeight:"700"}}>{target}%</div>
              </div>
              <input type="range" min={10} max={100} step={5} value={target} onChange={e=>setTarget(Number(e.target.value))} style={{width:"100%",accentColor:"#F0D98A",height:"4px",cursor:"pointer"}}/>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:"4px"}}>
                <span style={{fontFamily:"'Orbitron',monospace",fontSize:"8px",color:"var(--textsm)"}}>10%</span>
                <span style={{fontFamily:"'Orbitron',monospace",fontSize:"8px",color:"var(--textsm)"}}>100%</span>
              </div>
            </div>
          </div>

          {/* Commission */}
          <div className="neon-card" style={{padding:"18px",marginBottom:"12px",border:"1px solid rgba(240,217,138,0.2)"}}>
            <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"2px",color:"#F0D98A",marginBottom:"14px"}}>⚡ COMMISSION · {period.toUpperCase()}</div>
            {[{l:"Gross",v:fmtD(stats.gross),c:"var(--text)"},{l:"Cancellation Fund",v:"− "+fmtD(stats.cancFund),c:"var(--red)"},{l:"NET PAYOUT",v:fmtD(stats.net),c:"var(--green)"}].map((r,i)=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:i>0?"12px":"0",marginTop:i>0?"12px":"0",borderTop:i>0?"1px solid rgba(240,217,138,0.1)":"none"}}>
                <span style={{fontSize:"12px",color:"var(--textmd)"}}>{r.l}</span>
                <span style={{fontSize:"15px",fontWeight:"800",color:r.c,textShadow:"0 0 10px "+r.c+"60"}}>{r.v}</span>
              </div>
            ))}
          </div>

          {/* Revenue vs Pipeline */}
          <div className="neon-card" style={{padding:"18px",marginBottom:"12px"}}>
            <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"2px",color:"var(--textsm)",marginBottom:"16px"}}>REVENUE vs PIPELINE</div>
            <div style={{marginBottom:"14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
                <span style={{fontSize:"12px",color:"var(--green)",fontWeight:"600"}}>✓ CLOSED</span>
                <span style={{fontSize:"13px",fontWeight:"700",color:"var(--text)"}}>{fmt(stats.revenue)}</span>
              </div>
              <GlowBar value={stats.revenue} max={stats.revenue+stats.pipeline} color="var(--green)"/>
            </div>
            <div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
                <span style={{fontSize:"12px",color:"var(--amber)",fontWeight:"600"}}>⏳ PIPELINE</span>
                <span style={{fontSize:"13px",fontWeight:"700",color:"var(--text)"}}>{fmt(stats.pipeline)}</span>
              </div>
              <GlowBar value={stats.pipeline} max={stats.revenue+stats.pipeline} color="var(--amber)"/>
            </div>
          </div>

          {/* Full stats */}
          <div className="neon-card" style={{overflow:"hidden",marginBottom:"12px"}}>
            <div style={{padding:"13px 16px",borderBottom:"1px solid var(--border)",fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"2px",color:"var(--textsm)"}}>FULL STATS · {period.toUpperCase()}</div>
            {[
              {icon:"💰",label:"Closed Revenue",value:fmt(stats.revenue),color:"var(--green)"},
              {icon:"🔄",label:"Active Pipeline",value:fmt(stats.pipeline),color:"var(--amber)"},
              {icon:"📊",label:"Close Rate",value:pct(stats.closeRate),color:"var(--cyan)"},
              {icon:"🤝",label:"Deals Closed",value:stats.closed,color:"var(--green)"},
              {icon:"⏳",label:"Pending",value:stats.pending,color:"var(--amber)"},
              {icon:"🚶",label:"Tours on Floor",value:stats.tours,color:"var(--cyan)"},
              {icon:"🚫",label:"No Sale",value:stats.noSale,color:"var(--textmd)"},
              {icon:"💎",label:"Avg Deal Size",value:fmt(stats.avgDeal),color:"var(--purple2,#C090FF)"},
              {icon:"❌",label:"Cancelled",value:stats.cancelled,color:"var(--red)"},
            ].map((s,i,arr)=>(
              <div key={s.label} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 16px",borderBottom:i<arr.length-1?"1px solid var(--border)":"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                  <span style={{fontSize:"18px"}}>{s.icon}</span>
                  <span style={{fontSize:"13px",color:"var(--textmd)",fontWeight:"500"}}>{s.label}</span>
                </div>
                <span style={{fontSize:"15px",fontWeight:"800",color:s.color,textShadow:"0 0 8px "+s.color+"60"}}>{s.value}</span>
              </div>
            ))}
          </div>
        </div>
        <TabBar tab={tab} setTab={setTab} setScreen={setScreen} setFilter={setFilter}/>
      </div>
    );
  }

  // ── FORM ─────────────────────────────────────────────────
  if(screen==="form") return (
    <div style={wrap}>
      <NavBar title={editing?"EDIT CLIENT":"NEW CLIENT"} back={()=>{setForm(emptyForm);setEditing(null);setFE("");setScreen("list");setTab("clients");}} action={{label:editing?"UPDATE":"SAVE",fn:handleSubmit}}/>
      <div style={{padding:"16px 14px",display:"flex",flexDirection:"column",gap:"14px",animation:"fadeUp 0.3s ease"}}>

        {/* Basic info */}
        <div className="neon-card" style={{padding:"18px",display:"flex",flexDirection:"column",gap:"14px"}}>
          <div>
            <SectionLabel>Client Name *</SectionLabel>
            <input type="text" className="neon-input" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Full name or couple"/>
          </div>
          <div>
            <SectionLabel>Deal Value ($) *</SectionLabel>
            <input type="number" className="neon-input" value={form.value} onChange={e=>setForm(p=>({...p,value:e.target.value}))} placeholder="0"/>
          </div>
          <div>
            <SectionLabel>Tour Date</SectionLabel>
            <input type="date" className="neon-input" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))} style={{colorScheme:"dark"}}/>
          </div>
        </div>

        {/* Role */}
        <div className="neon-card" style={{padding:"18px"}}>
          <SectionLabel>Your Role</SectionLabel>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
            {SALE_TYPES.map(t=>{
              const a=form.sale_type===t;
              const r=COMM_RATES[t]||{normal:4};
              const rStr=Object.values(r).join("/")+"%";
              return <button key={t} onClick={()=>setForm(p=>({...p,sale_type:t,payment_type:"normal"}))} style={{background:a?"rgba(155,89,245,0.15)":"rgba(0,0,20,0.4)",border:"1px solid "+(a?"rgba(155,89,245,0.5)":"var(--border)"),color:a?"#C090FF":"var(--textmd)",padding:"12px",borderRadius:"10px",textAlign:"left",boxShadow:a?"0 0 16px rgba(155,89,245,0.2)":"none",transition:"all 0.15s"}}>
                <div style={{fontSize:"13px",fontWeight:"700"}}>{t}</div>
                <div style={{fontSize:"10px",marginTop:"3px",opacity:0.7,letterSpacing:"0.5px"}}>{rStr} commission</div>
              </button>;
            })}
          </div>
        </div>

        {/* Payment type */}
        {(form.sale_type==="Closer"||form.sale_type==="Front to Back")&&(
          <div className="neon-card" style={{padding:"18px"}}>
            <SectionLabel>Payment Type</SectionLabel>
            <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
              {[
                {id:"normal",  label:"Normal",          sub:form.sale_type==="Closer"?"6% commission":"8% commission"},
                {id:"dp50",    label:"Down Payment 50%",sub:form.sale_type==="Closer"?"8% commission":"10% commission"},
                ...(form.sale_type==="Front to Back"?[{id:"cash100",label:"Cash Out 100%",sub:"12% commission"}]:[]),
              ].map(opt=>{
                const a=form.payment_type===opt.id;
                return <button key={opt.id} onClick={()=>setForm(p=>({...p,payment_type:opt.id}))} style={{background:a?"rgba(0,255,136,0.08)":"rgba(0,0,20,0.4)",border:"1px solid "+(a?"rgba(0,255,136,0.3)":"var(--border)"),color:a?"var(--green)":"var(--textmd)",padding:"13px 16px",borderRadius:"10px",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",transition:"all 0.15s"}}>
                  <div>
                    <div style={{fontSize:"14px",fontWeight:a?"700":"500"}}>{opt.label}</div>
                    <div style={{fontSize:"10px",opacity:0.7,marginTop:"2px"}}>{opt.sub}</div>
                  </div>
                  {a&&<span style={{color:"var(--green)",fontSize:"18px",textShadow:"0 0 10px rgba(0,255,136,0.5)"}}>✓</span>}
                </button>;
              })}
            </div>
          </div>
        )}

        {/* Tier */}
        <div className="neon-card" style={{padding:"18px"}}>
          <SectionLabel>Membership Tier</SectionLabel>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
            {TIERS.map(t=>{
              const tc=TIER_CFG[t]; const a=form.tier===t;
              return <button key={t} onClick={()=>setForm(p=>({...p,tier:t}))} style={{background:a?tc.bg:"rgba(0,0,20,0.4)",border:"1px solid "+(a?tc.border:"var(--border)"),color:a?tc.color:"var(--textmd)",padding:"12px",borderRadius:"10px",fontSize:"13px",fontWeight:a?"700":"500",boxShadow:a?"0 0 12px "+tc.glow+"30":"none",transition:"all 0.15s",textShadow:a?"0 0 8px "+tc.glow+"60":"none"}}>{t.toUpperCase()}</button>;
            })}
          </div>
        </div>

        {/* Status */}
        <div className="neon-card" style={{padding:"18px"}}>
          <SectionLabel>Status</SectionLabel>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
            {STATUSES.map(s=>{
              const sc=STATUS_CFG[s]; const a=form.status===s;
              return <button key={s} className="status-btn" onClick={()=>setForm(p=>({...p,status:s}))} style={{background:a?sc.bg:"transparent",borderColor:a?sc.border:"var(--border)",color:a?sc.color:"var(--textsm)",boxShadow:a?"0 0 12px "+sc.dot+"25":"none"}}>
                <span style={{width:7,height:7,borderRadius:"50%",background:a?sc.dot:"var(--textsm)",boxShadow:a?"0 0 6px "+sc.dot:"none",display:"inline-block",flexShrink:0}}/>
                {s}
              </button>;
            })}
          </div>
        </div>

        {/* Commission preview */}
        {form.status==="Closed"&&form.value&&(()=>{
          const c2=calcComm(Number(form.value),form.sale_type,form.payment_type);
          return <div className="neon-card" style={{padding:"16px",border:"1px solid rgba(240,217,138,0.2)"}}>
            <div style={{fontFamily:"'Orbitron',monospace",fontSize:"9px",letterSpacing:"2px",color:"#F0D98A",marginBottom:"12px"}}>⚡ COMMISSION PREVIEW · {c2.rate}%</div>
            {[{l:"Gross",v:fmtD(c2.gross),c:"var(--text)"},{l:"Fund (−10%)",v:fmtD(c2.cancFund),c:"var(--red)"},{l:"NET",v:fmtD(c2.net),c:"var(--green)"}].map((r,i)=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",paddingTop:i>0?"10px":"0",marginTop:i>0?"10px":"0",borderTop:i>0?"1px solid rgba(240,217,138,0.1)":"none"}}>
                <span style={{fontSize:"12px",color:"var(--textmd)"}}>{r.l}</span>
                <span style={{fontSize:"14px",fontWeight:"800",color:r.c}}>{r.v}</span>
              </div>
            ))}
          </div>;
        })()}

        {/* Notes */}
        <div className="neon-card" style={{padding:"18px"}}>
          <SectionLabel>Notes</SectionLabel>
          <textarea className="neon-input" value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} rows={3} placeholder="Objections, rapport, follow-up…" style={{resize:"none",lineHeight:"1.6"}}/>
        </div>

        {formError&&<div style={{background:"rgba(255,51,102,0.1)",border:"1px solid rgba(255,51,102,0.3)",borderRadius:"10px",padding:"12px 14px",color:"var(--red)",fontSize:"11px",fontWeight:"700",letterSpacing:"1px",fontFamily:"'Orbitron',monospace"}}>⚠ {formError}</div>}

        <button className="glow-btn glow-btn-cyan" onClick={handleSubmit} disabled={saving}>{saving?"SAVING...":editing?"UPDATE CLIENT":"SAVE CLIENT"}</button>
      </div>
      <style>{"@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}"}</style>
    </div>
  );

  return null;
}

// ═══════════════════════════════════════════════════════════
// ROOT
// ═══════════════════════════════════════════════════════════
function Root(){
  const [user,setUser] = useState(loadSession);
  if(!user) return <AuthScreen onLogin={setUser}/>;
  return <App user={user} onLogout={()=>setUser(null)}/>;
}
`;</script>
</body>
</html>
